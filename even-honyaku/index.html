<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Honyaku</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Honyaku <span lang="ja">翻訳</span></h1>
      <div class="status">
        <span id="conn" class="pill">offline</span>
        <button id="listen" type="button" class="pill">Pause</button>
      </div>
    </header>

    <main id="log" aria-live="polite"></main>

    <details id="debug" open>
      <summary>Debug</summary>
      <pre id="debug-log"></pre>
    </details>

    <form id="typed" autocomplete="off">
      <input id="typed-text" type="text" placeholder="Type to test without the mic…" />
      <button type="submit">Send</button>
    </form>

    <button id="hold" type="button">Hold to talk in English</button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
